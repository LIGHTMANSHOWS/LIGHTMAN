<section class="reels-section" id="videos" aria-labelledby="reels-heading">
  <div class="container">
    <h2 id="reels-heading">EL SHOW <span>EN MOVIMIENTO</span></h2>
    <div class="reels-grid">
      {% for reel in site.data.instagram_reels %}
      {% assign video_path = '/assets/' | append: reel.id | append: '.mp4' %}
      <article class="reel-card" data-reel-id="{{ reel.id }}" aria-label="{{ reel.title | escape }}">
        <video class="reel-video" controls playsinline preload="metadata" aria-label="{{ reel.title | escape }}" aria-describedby="description-{{ reel.id }}">
          <source src="{{ video_path | relative_url }}#t={{ reel.start_seconds | default: 0.1 }}" type="video/mp4">
          Tu navegador no permite reproducir este video. <a href="{{ video_path | relative_url }}">Abrir {{ reel.title | escape }}</a>.
        </video>
        <p class="reel-description" id="description-{{ reel.id }}">{{ reel.title | escape }}. Demostración de {{ reel.label | escape }} de Lightman Perú.</p>
        <p class="reel-error" role="status" hidden>No se pudo cargar el video. <a href="{{ video_path | relative_url }}">Abrir video directamente</a>.</p>
      </article>
      {% endfor %}
    </div>
  </div>
</section>
